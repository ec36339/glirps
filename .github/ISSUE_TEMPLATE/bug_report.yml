name: Bug report
description: Report something in GLIRPS that does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **This issue will be public.** Do not report a new security vulnerability here. Follow the [security policy](https://github.com/ec36339/glirps/security/policy) instead.

        Remove personal data, passwords, tokens, and private paths from everything you post.

  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How can the problem be reproduced?
      description: Give the steps or a small program. If it concerns a sound, include the sound program values, seed, sample rate, and any changed synth settings.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: GLIRPS version
      description: A tag or commit hash.
      placeholder: v0.1.0
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Platform and compiler
      description: Include the operating system, processor architecture, compiler version, and build type.
      placeholder: Windows 11, x86-64, clang-cl 20, Release
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or error messages
      render: text

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched the existing issues.
          required: true
        - label: I removed personal data and secrets.
          required: true
        - label: This is not a new security vulnerability that should be reported privately.
          required: true
