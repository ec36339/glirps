name: CI

# Editing only a pull request's title or description starts a text-only run: it
# builds nothing, reruns the repository checks, and reuses the build results of
# the same commit. Changing the target branch builds.
# `check-earlier-builds.sh` tells the runs apart by this name.
run-name: "${{ github.event.action == 'edited' && !github.event.changes.base && format('Text-only run: {0}', github.event.pull_request.title) || '' }}"

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
    # `edited` starts the text-only runs.
    types: [opened, synchronize, reopened, edited]

# Every push to `develop` has its own group, so no run is dropped and each one
# checks its commit messages. Text-only runs have their own group, so they do
# not cancel builds.
concurrency:
  group: "ci-${{ github.event_name == 'push' && github.sha || github.ref }}\
    ${{ github.event.action == 'edited' && !github.event.changes.base && '-text' || '' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Debug build, plus the check that every public header compiles on its own
  # as C++20.
  debug:
    name: Build Debug and Check Headers
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      - name: Configure
        run: cmake --preset linux-debug

      - name: Build
        run: cmake --build --preset linux-debug

      - name: Check public headers as C++20
        run: cmake --build --preset linux-debug --target all_verify_interface_header_sets

  release:
    name: Build and Test Release
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release

      - name: Test
        run: ctest --preset linux-release

      # A skipped hash test passes, so a wrong platform condition would turn the
      # sound regression tests off unnoticed.
      - name: Check that the golden hashes were compared
        run: |
          out/build/linux-release/tests/glirps_tests --gtest_filter='Programs/GoldenHashTests.*' >golden.log
          grep -E '^\[  PASSED  \] [1-9]' golden.log
          if grep -F SKIPPED golden.log; then
            echo "::error::Golden hash tests were skipped."
            exit 1
          fi

  tsan:
    name: TSan Tests
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      # ThreadSanitizer's shadow memory layout needs a lower address-space
      # randomization entropy than the runner image sets by default.
      - name: Lower address-space randomization
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: cmake --preset linux-tsan

      - name: Build
        run: cmake --build --preset linux-tsan --target glirps_tests_tsan

      # Selects the one built test by name: ctest registers every test
      # executable at configure time, so the unbuilt ones are listed too.
      - name: Test
        run: ctest --preset linux-tsan -R "^glirps_tests_tsan$"

  # The library alone, with every optional part off and nothing to fetch.
  core:
    name: Core only
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      # The dependency provider fails the configure if the core asks for any
      # dependency.
      - name: Configure
        run: >-
          cmake --preset linux-package -DFETCHCONTENT_FULLY_DISCONNECTED=ON
          -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES="$PWD/.github/cmake/forbid-dependencies.cmake"

      - name: Build and install
        run: cmake --build --preset linux-package

      - name: Check the installed package
        run: bash .github/scripts/check-core-package.sh out/build/linux-package out/install/linux-package

  # Other projects can use the library through FetchContent and as an installed
  # package.
  consumers:
    name: Consumers
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    env:
      CONSUMER_ARGS: >-
        -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++-22
        -DCMAKE_CXX_FLAGS=-stdlib=libc++
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      - name: Build and run the FetchContent consumer
        run: |
          cmake -S tests/consumers/fetch_content -B out/consumers/fetch_content $CONSUMER_ARGS \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi"
          cmake --build out/consumers/fetch_content
          out/consumers/fetch_content/consumer

      - name: Install the package
        run: |
          cmake --preset linux-package
          cmake --build --preset linux-package

      - name: Build and run the find_package consumer
        run: |
          cmake -S tests/consumers/find_package -B out/consumers/find_package $CONSUMER_ARGS \
            -DCMAKE_EXE_LINKER_FLAGS="-stdlib=libc++ -lc++abi" \
            -DCMAKE_PREFIX_PATH="$PWD/out/install/linux-package"
          cmake --build out/consumers/find_package
          out/consumers/find_package/consumer

  # Each example builds and runs, and its output is unchanged.
  examples:
    name: Examples
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      - name: Configure
        run: cmake --preset linux-release

      - name: Build
        run: cmake --build --preset linux-release --target hello-wav

      - name: Run and check the output
        run: ctest --preset linux-release -R "^hello_wav_hash$" --no-tests=error

  # The API reference and the guides. A Doxygen warning fails the build. The
  # site of a pull request is a download only; `deploy` publishes `develop`.
  docs:
    name: Build documentation
    if: github.event.action != 'edited' || github.event.changes.base
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-clang

      # A pinned release: the version in Ubuntu's package cannot build the
      # documentation. The checksum is the one GitHub publishes for the file.
      - name: Install Doxygen
        env:
          DOXYGEN_VERSION: 1.18.0
          DOXYGEN_SHA256: 14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90
        run: |
          archive="doxygen-$DOXYGEN_VERSION.linux.bin.tar.gz"
          release="Release_${DOXYGEN_VERSION//./_}"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/doxygen/doxygen/releases/download/$release/$archive"
          echo "$DOXYGEN_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP"
          bin="$RUNNER_TEMP/doxygen-$DOXYGEN_VERSION/bin"
          "$bin/doxygen" --version
          echo "$bin" >>"$GITHUB_PATH"

      # CMake leaves the target out if it finds no Doxygen, which fails the
      # build step.
      - name: Configure
        run: cmake --preset linux-package

      - name: Build
        run: cmake --build --preset linux-package --target glirps_docs

      - name: Attach the site to the run
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: glirps-docs
          path: out/build/linux-package/docs/html
          if-no-files-found: error

      - name: Prepare the site for publishing
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/build/linux-package/docs/html

  # Text-only runs: the builds of this commit must have succeeded.
  earlier-builds:
    name: Earlier build results
    if: github.event.action == 'edited' && !github.event.changes.base
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Wait for the builds and check them
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-earlier-builds.sh "$HEAD_SHA"

  # No secrets, no binary files, no Git LFS, no large files, and clean commit
  # messages. It runs after the other jobs, so it reads the title as late as
  # possible.
  repository:
    name: Repository hygiene
    if: ${{ !cancelled() }}
    needs: [debug, release, tsan, core, consumers, examples, docs, earlier-builds]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # All checks need the history.
          fetch-depth: 0

      # A pinned release. The checksum is the one GitHub publishes for the file.
      - name: Install Gitleaks
        if: github.event_name == 'pull_request'
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS_VERSION/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" gitleaks

      # Scans each commit on its own, so it also finds a secret that a later
      # commit removes. Merges are compared with their first parent, as git
      # otherwise shows no changes for them.
      - name: Scan for secrets
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # Gitleaks passes even if git rejects the range, so git checks it
          # first.
          git rev-list "$BASE_SHA..$HEAD_SHA" -- >/dev/null
          "$RUNNER_TEMP/gitleaks" git --redact --verbose \
            --log-opts="--diff-merges=first-parent $BASE_SHA..$HEAD_SHA" .

      # Pull requests only: every change reaches `develop` through one.
      - name: Check added and modified files
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/check-repository.sh "$BASE_SHA..$HEAD_SHA"

      # Only the commits this run adds, so a bad message already on `develop`
      # cannot fail every later run. The branch name and title become part of
      # the merge commit message; both are empty on a push. The title of the
      # event may be outdated by now, so the current one is read.
      - name: Check commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          BRANCH_NAME: ${{ github.event.pull_request.head.ref }}
          PULL_REQUEST: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          title=
          if [[ -n $PULL_REQUEST ]]; then
            title=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PULL_REQUEST" --jq .title)
          fi
          bash .github/scripts/check-commit-messages.sh "$BASE_SHA..HEAD" "$BRANCH_NAME" "$title"

  # The single check to mark as required in branch protection. Every other job
  # but `deploy`, which follows it, belongs in `needs` and in the loop below. It
  # runs in every run: GitHub treats a skipped required check as passed.
  ci-result:
    name: CI Result
    if: always()
    needs: [debug, release, tsan, core, consumers, examples, docs, earlier-builds, repository]
    runs-on: ubuntu-24.04
    steps:
      - name: Check job results
        env:
          TEXT_ONLY: ${{ github.event.action == 'edited' && !github.event.changes.base }}
          DEBUG: ${{ needs.debug.result }}
          RELEASE: ${{ needs.release.result }}
          TSAN: ${{ needs.tsan.result }}
          CORE: ${{ needs.core.result }}
          CONSUMERS: ${{ needs.consumers.result }}
          EXAMPLES: ${{ needs.examples.result }}
          DOCS: ${{ needs.docs.result }}
          EARLIER_BUILDS: ${{ needs.earlier-builds.result }}
          REPOSITORY: ${{ needs.repository.result }}
        run: |
          # A text-only run skips the builds and takes over earlier results.
          # Every other run does the reverse.
          builds=success
          earlier=skipped
          if [ "$TEXT_ONLY" = true ]; then
            builds=skipped
            earlier=success
          fi
          status=0
          for entry in "debug:$builds:$DEBUG" "release:$builds:$RELEASE" \
              "tsan:$builds:$TSAN" "core:$builds:$CORE" \
              "consumers:$builds:$CONSUMERS" "examples:$builds:$EXAMPLES" \
              "docs:$builds:$DOCS" \
              "earlier-builds:$earlier:$EARLIER_BUILDS" "repository:success:$REPOSITORY"; do
            IFS=: read -r name expected result <<<"$entry"
            if [ "$result" != "$expected" ]; then
              echo "::error::$name ended with result '$result' instead of '$expected'."
              status=1
            fi
          done
          exit $status

  # Publishes the site of a push to `develop` that passed. `!cancelled()` stops a
  # skipped upstream job from skipping this one.
  deploy:
    name: Publish documentation
    needs: ci-result
    if: >-
      !cancelled() && github.event_name == 'push' && needs.ci-result.result == 'success'
    runs-on: ubuntu-24.04
    # One publication at a time, and a running one is not cut off.
    concurrency:
      group: pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      # The runs of two pushes may finish in either order. Only the newest commit
      # publishes, so an older one cannot replace its site.
      - name: Check that this commit is the head of develop
        id: head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/develop" --jq .object.sha)
          if [[ $head == "$GITHUB_SHA" ]]; then
            echo "current=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::Not published: develop has moved on to $head."
          fi

      - name: Publish to GitHub Pages
        id: publish
        if: steps.head.outputs.current == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
